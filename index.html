<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f3">
  <title>개념의 숲 | 개념 학습</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d302d;
      --muted: #74817b;
      --paper: #fbfcf9;
      --canvas: #f2f5f0;
      --line: #e4e9e1;
      --green: #2f725f;
      --green-dark: #205442;
      --mint: #e4f2e9;
      --lime: #cfe77e;
      --orange: #e6a05f;
      --shadow: 0 16px 48px rgba(37, 61, 48, .08);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(47, 114, 95, .25);
      outline-offset: 2px;
    }
    .app-shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh;
      padding: 28px 18px 20px; background: #fbfcf9; border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 3px 11px 30px; }
    .brand-mark {
      display: grid; place-items: center; width: 39px; height: 39px; border-radius: 14px;
      color: #fff; background: var(--green); font-size: 19px;
    }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
    .brand-caption { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .nav-label { padding: 0 12px 10px; color: #99a39d; font-size: 10px; font-weight: 800; letter-spacing: 1.4px; }
    .steps { display: grid; gap: 5px; }
    .step-link {
      display: flex; align-items: center; width: 100%; gap: 12px; padding: 10px 12px;
      border: 0; border-radius: 12px; color: #77827c; background: transparent; text-align: left;
      font-size: 13px; transition: .18s ease;
    }
    .step-link:hover:not(:disabled) { background: #f1f5ef; color: var(--ink); }
    .step-link.active { color: var(--green-dark); background: var(--mint); font-weight: 750; }
    .step-link:disabled { cursor: default; opacity: .48; }
    .step-number {
      display: grid; place-items: center; flex: 0 0 24px; width: 24px; height: 24px;
      border: 1px solid #dfe6dc; border-radius: 50%; background: #fff; font-size: 11px; font-weight: 700;
    }
    .step-link.active .step-number, .step-link.done .step-number {
      border-color: var(--green); color: #fff; background: var(--green);
    }
    .side-bottom { margin-top: auto; }
    .streak-card {
      padding: 15px; border: 1px solid #e8ebdf; border-radius: 16px;
      background: linear-gradient(140deg, #f8f6e8, #f2f7e9);
    }
    .streak-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 750; }
    .streak-icon { font-size: 18px; }
    .streak-card p { margin: 7px 0 0; color: #778076; font-size: 11px; line-height: 1.55; }
    .side-note { padding: 14px 10px 0; color: #9aa39d; font-size: 10px; line-height: 1.6; }
    main { min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 20px clamp(22px, 5vw, 66px); border-bottom: 1px solid var(--line); background: rgba(251,252,249,.7);
    }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .save-state { color: var(--muted); font-size: 11px; }
    .icon-button {
      display: grid; place-items: center; width: 35px; height: 35px; border: 1px solid var(--line);
      border-radius: 11px; color: var(--ink); background: var(--paper);
    }
    .content { width: min(950px, 100%); margin: 0 auto; padding: 42px clamp(20px, 5vw, 66px) 72px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { margin-bottom: 9px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); line-height: 1.2; letter-spacing: -1.5px; }
    .subtitle { max-width: 590px; margin: 11px 0 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 99px;
      color: #567166; background: #eaf2eb; font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .card { border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .card-pad { padding: clamp(20px, 4vw, 30px); }
    .card-title { margin: 0; font-size: 17px; letter-spacing: -.45px; }
    .card-desc { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; margin-top: 24px; }
    .field { display: grid; gap: 8px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #42534b; font-size: 12px; font-weight: 750; }
    .field input, .field textarea, .field select, .answer-area {
      width: 100%; border: 1px solid #dfe6dd; border-radius: 11px; color: var(--ink); background: #fff;
      padding: 12px 13px; font-size: 13px; line-height: 1.65;
    }
    .field textarea, .answer-area { min-height: 116px; resize: vertical; }
    .field input::placeholder, .field textarea::placeholder, .answer-area::placeholder { color: #a5aea8; }
    .help { color: #8c9790; font-size: 10px; line-height: 1.5; }
    .file-label { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-size: 11px; font-weight: 750; cursor: pointer; }
    .file-label input { display: none; }
    .notice { margin-top: 18px; padding: 13px 15px; border-radius: 12px; color: #63736a; background: #f2f6ef; font-size: 11px; line-height: 1.65; }
    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 43px;
      padding: 0 17px; border: 1px solid transparent; border-radius: 11px; font-size: 12px; font-weight: 750; transition: .18s ease;
    }
    .btn-primary { color: white; background: var(--green); }
    .btn-primary:hover { background: var(--green-dark); transform: translateY(-1px); }
    .btn-secondary { border-color: var(--line); color: #53645a; background: #fff; }
    .btn-secondary:hover { background: #f4f7f2; }
    .btn-quiet { min-height: 36px; border-color: transparent; color: var(--muted); background: transparent; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(220px, .7fr); gap: 18px; }
    .prompt-box { padding: 19px; border-radius: 15px; background: #f0f6ef; }
    .prompt-label { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .8px; }
    .prompt-text { margin: 10px 0 0; font-size: 17px; font-weight: 750; line-height: 1.55; letter-spacing: -.5px; }
    .inline-field { margin-top: 17px; }
    .inline-field label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 750; }
    .confidence-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .choice {
      padding: 8px 11px; border: 1px solid #e1e7de; border-radius: 9px; color: #65756a; background: #fff; font-size: 11px;
    }
    .choice.selected { border-color: var(--green); color: var(--green-dark); background: #e7f2e8; font-weight: 750; }
    .info-tile { padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .info-tile .tile-icon { font-size: 21px; }
    .info-tile h3 { margin: 10px 0 6px; font-size: 13px; }
    .info-tile p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
    .concept-banner { position: relative; overflow: hidden; padding: 27px; border-radius: 18px; color: #f7fbf6; background: #285d4d; }
    .concept-banner::after { position: absolute; right: -25px; bottom: -79px; width: 210px; height: 210px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; content: ""; }
    .concept-banner::before { position: absolute; right: 33px; bottom: -37px; width: 135px; height: 135px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; content: ""; }
    .concept-banner .label { color: #bfdfc5; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .concept-banner h2 { position: relative; z-index: 1; margin: 9px 0; font-size: 26px; letter-spacing: -.7px; }
    .concept-banner p { position: relative; z-index: 1; max-width: 630px; margin: 0; color: #e0eee4; font-size: 13px; line-height: 1.8; }
    .content-block { margin-top: 19px; padding: 20px; border: 1px solid var(--line); border-radius: 15px; background: #fff; }
    .content-block h3 { margin: 0; font-size: 14px; }
    .content-block p { margin: 9px 0 0; color: #65736c; font-size: 12px; line-height: 1.85; white-space: pre-wrap; }
    .example-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 13px; }
    .example { padding: 14px; border-radius: 12px; background: #f4f7f2; }
    .example.no { background: #f8f4ed; }
    .example strong { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .example p { margin-top: 7px; font-size: 11px; }
    .reveal { display: none; margin-top: 12px; padding: 12px; border-radius: 10px; color: #4b6657; background: #edf5ec; font-size: 11px; line-height: 1.65; }
    .reveal.show { display: block; }
    .concept-map { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 8px; margin: 20px 0; }
    .map-node { padding: 13px 9px; border: 1px solid #dce8da; border-radius: 12px; color: #315b4b; background: #f2f7ef; text-align: center; font-size: 11px; font-weight: 750; }
    .map-arrow { color: #8b9b8e; font-size: 17px; }
    .template-box { padding: 16px; border-left: 3px solid var(--lime); border-radius: 0 11px 11px 0; background: #f8f8ef; }
    .template-box strong { font-size: 11px; }
    .template-box p { margin: 7px 0 0; color: #667168; font-size: 12px; line-height: 1.7; }
    .quiz-list { display: grid; gap: 14px; margin-top: 19px; }
    .quiz-item { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .quiz-number { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .7px; }
    .quiz-question { margin: 8px 0 13px; font-size: 14px; font-weight: 750; line-height: 1.6; }
    .quiz-options { display: grid; gap: 8px; }
    .quiz-option {
      display: flex; align-items: flex-start; gap: 9px; padding: 10px 12px; border: 1px solid #e7ebe4;
      border-radius: 10px; color: #5d6b62; background: #fff; text-align: left; font-size: 11px; line-height: 1.6;
    }
    .quiz-option:hover { border-color: #b7cfbd; background: #f8fbf6; }
    .quiz-option.selected { border-color: var(--green); color: var(--green-dark); background: #eff6ed; }
    .quiz-option.correct { border-color: #7aaa7f; background: #eff7ee; }
    .quiz-option.wrong { border-color: #d7a47e; background: #fff7ef; }
    .option-dot { display: grid; place-items: center; flex: 0 0 18px; height: 18px; border: 1px solid #d9e1d8; border-radius: 50%; font-size: 9px; }
    .feedback { display: none; margin-top: 11px; padding: 11px 12px; border-radius: 9px; color: #536b5b; background: #f0f6ed; font-size: 11px; line-height: 1.65; }
    .feedback.show { display: block; }
    .rubric { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
    .rubric-item { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .rubric-item strong { font-size: 11px; }
    .rubric-item p { margin: 6px 0 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .score-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-radius: 13px; background: #f2f6ee; }
    .score-row strong { font-size: 13px; }
    .score-value { color: var(--green); font-size: 18px; font-weight: 850; }
    .reflection-options { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 13px; }
    .reflection-choice {
      min-width: 105px; padding: 13px 10px; border: 1px solid var(--line); border-radius: 12px;
      color: #68756c; background: #fff; text-align: center; font-size: 11px;
    }
    .reflection-choice .emoji { display: block; margin-bottom: 5px; font-size: 18px; }
    .reflection-choice.selected { border-color: var(--green); color: var(--green-dark); background: #eff6ec; font-weight: 750; }
    .complete-card { overflow: hidden; text-align: center; }
    .complete-hero { padding: 40px 24px 30px; color: #fff; background: linear-gradient(135deg, #285d4d, #397861); }
    .complete-hero .medal { font-size: 42px; }
    .complete-hero h2 { margin: 10px 0 7px; font-size: 26px; letter-spacing: -.8px; }
    .complete-hero p { margin: 0; color: #d8eadc; font-size: 12px; }
    .complete-body { padding: 24px; text-align: left; }
    .summary-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid #edf0ea; font-size: 11px; line-height: 1.6; }
    .summary-row:last-child { border: 0; }
    .summary-row span:first-child { flex: 0 0 110px; color: var(--muted); }
    .summary-row span:last-child { white-space: pre-wrap; }
    .empty-note { padding: 16px; border-radius: 12px; color: #738077; background: #f4f6f1; font-size: 11px; line-height: 1.7; }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 5; padding: 12px 16px;
      border-radius: 12px; color: #fff; background: #263d33; box-shadow: var(--shadow); font-size: 12px;
      opacity: 0; transform: translateY(8px); transition: .2s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar { position: sticky; z-index: 3; top: 0; height: auto; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { padding: 0 3px 10px; }
      .brand-mark { width: 31px; height: 31px; border-radius: 11px; font-size: 16px; }
      .brand-name { font-size: 14px; }
      .brand-caption, .nav-label, .side-bottom { display: none; }
      .steps { display: flex; overflow-x: auto; gap: 5px; padding-bottom: 1px; scrollbar-width: none; }
      .steps::-webkit-scrollbar { display: none; }
      .step-link { flex: 0 0 auto; width: auto; gap: 6px; padding: 6px 8px; font-size: 10px; }
      .step-number { flex-basis: 21px; width: 21px; height: 21px; font-size: 9px; }
      .topbar { padding: 12px 18px; }
      .content { padding-top: 28px; }
      .two-col { grid-template-columns: 1fr; }
      .two-col .info-tile { display: none; }
      .concept-map { grid-template-columns: 1fr; }
      .map-arrow { transform: rotate(90deg); text-align: center; }
    }
    @media (max-width: 520px) {
      .form-grid, .example-grid, .rubric { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .page-heading { display: block; }
      .page-heading > .tag { margin-top: 15px; }
      .actions { align-items: stretch; }
      .actions .btn { flex: 1; }
      .save-state { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="학습 진행">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✳</div>
        <div><div class="brand-name">개념의 숲</div><div class="brand-caption">생각을 연결하고, 배움을 옮기다</div></div>
      </div>
      <div class="nav-label">LEARNING PATH</div>
      <nav class="steps" id="stepNav" aria-label="학습 단계"></nav>
      <div class="side-bottom">
        <div class="streak-card">
          <div class="streak-top"><span>오늘의 배움 씨앗</span><span class="streak-icon" aria-hidden="true">🌱</span></div>
          <p>정답을 맞히는 것보다, 생각을 연결하고 다시 시도하는 과정이 중요해요.</p>
        </div>
        <div class="side-note">학습 기록은 이 기기에 저장됩니다.<br>교과서 원문은 외부로 전송되지 않습니다.</div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">나의 학습 <span aria-hidden="true">/</span> 새 학습 만들기</div>
        <div class="top-actions">
          <span class="save-state" id="saveState" aria-live="polite">이 기기에 자동 저장</span>
          <button class="icon-button" id="resetButton" type="button" aria-label="학습 초기화" title="새 학습">↻</button>
        </div>
      </header>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      const STORAGE_KEY = "concept-grove-state-v1";
      const defaultState = {
        step: 0,
        completed: [],
        form: {
          grade: "중학교 2학년",
          subject: "과학",
          title: "생태계의 상호작용",
          explanation: "생태계에서는 생물과 비생물이 서로 영향을 주고받습니다. 생물은 먹이 관계와 환경의 영향을 받으며, 한 요소의 변화는 다른 요소에도 이어질 수 있습니다.",
          example: "가뭄으로 식물이 줄어들면 식물을 먹는 초식동물이 줄고, 이를 먹는 육식동물의 수도 달라질 수 있어요.",
          counterexample: "숲에 사는 동물의 이름을 종류별로 외우는 것만으로는 생태계 요소 사이의 관계를 설명했다고 보기 어려워요.",
          textbook: "생태계는 생물 요소와 비생물 요소로 이루어져 있다. 생태계의 구성 요소들은 서로 영향을 주고받으며, 먹이 관계를 통해 에너지와 물질이 이동한다.",
          prior: "",
          confidence: "",
          generalization: "",
          checkAnswer: "",
          transferAnswer: "",
          reflection: "",
          confusion: ""
        },
        quizAnswers: {},
        checkedQuiz: false
      };
      const stageNames = ["학습 준비", "관계 맺기", "개념 이해", "관계 정리", "이해 점검", "새 상황에 적용", "성찰하기", "배움 기록"];
      const content = document.getElementById("content");
      const nav = document.getElementById("stepNav");
      let state = loadState();
      let toastTimer;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved || typeof saved !== "object") return structuredCloneSafe(defaultState);
          return {
            ...structuredCloneSafe(defaultState),
            ...saved,
            form: { ...defaultState.form, ...(saved.form || {}) },
            completed: Array.isArray(saved.completed) ? saved.completed : [],
            quizAnswers: saved.quizAnswers && typeof saved.quizAnswers === "object" ? saved.quizAnswers : {}
          };
        } catch (error) {
          console.warn("저장된 학습 기록을 불러오지 못했습니다.", error);
          return structuredCloneSafe(defaultState);
        }
      }

      function structuredCloneSafe(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          document.getElementById("saveState").textContent = "방금 저장됨";
        } catch (error) {
          console.error("학습 기록을 저장하지 못했습니다.", error);
          document.getElementById("saveState").textContent = "저장 공간을 사용할 수 없음";
        }
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
        });
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () { toast.classList.remove("show"); }, 2400);
      }

      function renderNav() {
        nav.innerHTML = stageNames.slice(1).map(function (name, index) {
          const step = index + 1;
          const done = state.completed.includes(step);
          const active = state.step === step;
          return '<button class="step-link' + (active ? " active" : "") + (done ? " done" : "") +
            '" type="button" data-step="' + step + '"' + (step > highestAvailable() ? " disabled" : "") +
            ' aria-current="' + (active ? "step" : "false") + '">' +
            '<span class="step-number">' + (done ? "✓" : step) + '</span><span>' + name + '</span></button>';

        if (state.step === 0) return 0;
        return Math.min(7, Math.max(state.step, ...state.completed.map(function (step) { return step + 1; })));

      function goTo(step) {
        if (step < 0 || step > 7 || step > highestAvailable()) return;
        state.step = step;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function finishStep(step) {
        if (!state.completed.includes(step)) state.completed.push(step);
        state.step = Math.min(7, step + 1);
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });

          '<div class="reflection-options">' + [
            ["🌱", "더 알아볼래요"],
            ["🌿", "조금 설명할 수 있어요"],
            ["🌳", "새 사례에도 적용할 수 있어요"]
          ].map(function (item) {
            return '<button class="reflection-choice' + (state.form.reflection === item[1] ? " selected" : "") + '" type="button" data-reflection="' + item[1] + '"><span class="emoji">' + item[0] + '</span>' + item[1] + '</button>';
          }).join("") + '</div>' +
          '<div class="inline-field"><label for="confusion">아직 헷갈리거나 더 궁금한 점</label><textarea class="answer-area" id="confusion" data-field="confusion" placeholder="예: ... 부분을 조금 더 알고 싶어요.">' + escapeHtml(state.form.confusion) + '</textarea></div>' +
          '<div class="inline-field"><label for="reflectionAnswer">처음의 생각과 비교해 새롭게 알게 된 점</label><textarea class="answer-area" id="reflectionAnswer" data-field="reflectionAnswer" placeholder="처음에는 ...라고 생각했지만, 지금은 ...라고 설명할 수 있어요.">' + escapeHtml(state.form.reflectionAnswer || "") + '</textarea></div>' +
          '<div class="notice">학습자의 답을 자동으로 채점하지 않습니다. 자기 설명을 바탕으로 다음에 더 배울 점을 찾아보세요.</div>' +
          actionRow(5, "배움 기록 보기", null, false) + '</section>';
        bindTextInputs();
        content.querySelectorAll("[data-reflection]").forEach(function (button) {
          button.addEventListener("click", function () {
            state.form.reflection = button.dataset.reflection;
            saveState();
            render();
          });
        });
      }

      function renderSummary() {
        const score = quizQuestions.reduce(function (total, question, index) {
          return total + (state.quizAnswers[index] === question.correct ? 1 : 0);
        }, 0);
        const rows = [
          ["학습 개념", state.form.title],
          ["처음의 생각", state.form.prior || "아직 기록하지 않았어요."],
          ["나의 일반화", state.form.generalization || "아직 기록하지 않았어요."],
          ["새 상황에 적용", state.form.transferAnswer || "아직 기록하지 않았어요."],
          ["나의 이해 정도", state.form.reflection || "아직 선택하지 않았어요."],
          ["더 알아볼 점", state.form.confusion || "아직 기록하지 않았어요."]
        ];
        content.innerHTML = titleBlock("07 · YOUR LEARNING", "오늘의 배움이 자랐어요", "완료한 활동과 생각을 한곳에 모았어요. 이 기록은 이 기기의 브라우저에 저장됩니다.", "🏅 학습 여정 완료") +
          '<section class="card complete-card"><div class="complete-hero"><div class="medal" aria-hidden="true">🌳</div><h2>개념 탐구 여정 완료!</h2><p>새로운 상황까지 생각을 옮겨 본 당신의 배움에 박수를 보내요.</p></div>' +
          '<div class="complete-body"><div class="score-row"><strong>개념 이해 점검</strong><span class="score-value">' + score + ' / 3</span></div>' +
          '<p class="card-desc" style="margin:10px 0 7px">점수는 정답 개수의 참고값이며, 학습자의 능력을 평가하지 않아요.</p>' +
          rows.map(function (row) { return '<div class="summary-row"><span>' + escapeHtml(row[0]) + '</span><span>' + escapeHtml(row[1]) + '</span></div>'; }).join("") +
          '<div class="actions"><button class="btn btn-secondary" type="button" id="backToReflect">← 성찰 수정하기</button><button class="btn btn-primary" type="button" id="newLearning">새 학습 시작하기 <span aria-hidden="true">↻</span></button></div></div></section>';
        document.getElementById("backToReflect").addEventListener("click", function () { goTo(6); });
        document.getElementById("newLearning").addEventListener("click", resetLearning);
      }

      function render() {
        renderNav();
        updateHeader();
        if (state.step === 0) renderSetup();
        else if (state.step === 1) renderConnection();
        else if (state.step === 2) renderConcept();
        else if (state.step === 3) renderOrganize();
        else if (state.step === 4) renderQuiz();
        else if (state.step === 5) renderTransfer();
        else if (state.step === 6) renderReflection();
        else renderSummary();
        wireActions();
      }

      function resetLearning() {
        state = structuredCloneSafe(defaultState);
        saveState();
        render();
        showToast("새 학습을 시작할 준비가 됐어요.");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.getElementById("resetButton").addEventListener("click", resetLearning);
      render();
    }());
  </script>
</body>
</html>
